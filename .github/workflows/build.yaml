name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['release/v*']
  pull_request:
    branches: [main]

env:
  IMAGE: amerenda/llm-agents
  GITOPS_REPO: amerenda/k3s-dean-gitops

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      piper: ${{ steps.changes.outputs.piper }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            piper:
              - 'piper/**'

  test-piper:
    needs: detect-changes
    if: needs.detect-changes.outputs.piper == 'true' || startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd piper
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests
        run: |
          cd piper
          python -m pytest test_piper.py -v

  build-piper:
    needs: test-piper
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/release/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/release/}"
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
            echo "pr_prefix=release" >> $GITHUB_OUTPUT
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
            echo "pr_prefix=deploy" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./piper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:piper-${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:piper-latest
          cache-from: type=gha,scope=piper
          cache-to: type=gha,mode=max,scope=piper

      - name: Raise PR to gitops
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PREFIX: ${{ steps.tag.outputs.pr_prefix }}
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          git clone https://x-access-token:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git /tmp/gitops
          cd /tmp/gitops

          BRANCH="${PREFIX}/llm-agents-piper-${TAG}"
          git checkout -b "${BRANCH}"

          sed -i "s|amerenda/llm-agents:piper-[^ ]*|amerenda/llm-agents:piper-${TAG}|g" \
            apps/llm-agents/piper/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "${PREFIX}: llm-agents piper ${TAG}"
          git push origin "${BRANCH}"

          gh pr create \
            --repo ${GITOPS_REPO} \
            --base main \
            --head "${BRANCH}" \
            --title "${PREFIX}: llm-agents piper ${TAG}" \
            --body "Auto-generated by llm-agents CI.

          Image: \`amerenda/llm-agents:piper-${TAG}\`
          Source: https://github.com/amerenda/llm-agents/commit/${GITHUB_SHA}"
