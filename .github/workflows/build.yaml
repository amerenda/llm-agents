name: Build and Deploy

on:
  push:
    branches: [main]
    tags: ['release/v*']
  pull_request:
    branches: [main]

env:
  IMAGE: amerenda/llm-agents
  GITOPS_REPO: amerenda/k3s-dean-gitops

jobs:
  detect-changes:
    runs-on: arc-runner-set
    outputs:
      piper: ${{ steps.changes.outputs.piper }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            piper:
              - 'piper/**'

  test-piper:
    needs: detect-changes
    if: needs.detect-changes.outputs.piper == 'true' || startsWith(github.ref, 'refs/tags/release/')
    runs-on: arc-runner-set
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          cd piper
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests
        run: |
          cd piper
          python -m pytest test_piper.py -v

  build-piper:
    needs: test-piper
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-set
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      pr_prefix: ${{ steps.tag.outputs.pr_prefix }}
    container:
      image: amerenda/k3s-runners:kaniko
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/release/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/release/}"
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "pr_prefix=release" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "pr_prefix=deploy" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p /kaniko/.docker
          AUTH=$(echo -n "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" | base64)
          echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
          /kaniko/executor \
            --context="${GITHUB_WORKSPACE}/piper" \
            --dockerfile=Dockerfile \
            --destination="${IMAGE}:piper-${TAG}" \
            --destination="${IMAGE}:piper-latest" \
            --cache=true \
            --cache-repo="${IMAGE}:cache"

  deploy-piper:
    needs: build-piper
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-set
    container:
      image: ubuntu:22.04
      env:
        GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
    steps:
      - name: Install git and curl
        run: apt-get update && apt-get install -y git curl

      - name: Raise PR to gitops
        shell: bash
        env:
          TAG: ${{ needs.build-piper.outputs.tag }}
          PREFIX: ${{ needs.build-piper.outputs.pr_prefix }}
        run: |
          git clone https://x-access-token:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git /tmp/gitops
          cd /tmp/gitops

          BRANCH="${PREFIX}/llm-agents-piper-${TAG}"
          git checkout -b "${BRANCH}"

          sed -i "s|amerenda/llm-agents:piper-[^ ]*|amerenda/llm-agents:piper-${TAG}|g" \
            apps/llm-agents/piper/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "${PREFIX}: llm-agents piper ${TAG}"
          git push origin "${BRANCH}"

          curl -s -X POST \
            -H "Authorization: token ${GITOPS_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITOPS_REPO}/pulls" \
            -d "{
              \"title\": \"${PREFIX}: llm-agents piper ${TAG}\",
              \"body\": \"Auto-generated by llm-agents CI.\\n\\nImage: \`amerenda/llm-agents:piper-${TAG}\`\\nSource: https://github.com/amerenda/llm-agents/commit/${GITHUB_SHA}\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\"
            }"
