name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['release/v*']
  pull_request:
    branches: [main]

env:
  IMAGE: amerenda/llm-agents
  GITOPS_REPO: amerenda/k3s-dean-gitops

jobs:
  detect-changes:
    runs-on: [self-hosted, mac-mini]
    outputs:
      piper: ${{ steps.changes.outputs.piper }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            piper:
              - 'piper/**'

  test-piper:
    needs: detect-changes
    if: needs.detect-changes.outputs.piper == 'true' || startsWith(github.ref, 'refs/tags/release/')
    runs-on: [self-hosted, mac-mini]
    steps:
      - uses: actions/checkout@v6
      - name: Run tests in container
        run: |
          docker run --rm -v "$PWD/piper:/app" -w /app python:3.12-slim bash -c "
            pip install -q -r requirements.txt pytest httpx &&
            python -m pytest test_piper.py -v
          "

  set-tag:
    needs: test-piper
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-llm-agents
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      pr_prefix: ${{ steps.tag.outputs.pr_prefix }}
    steps:
      - name: Set image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/release/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/release/}"
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "pr_prefix=release" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "pr_prefix=deploy" >> "$GITHUB_OUTPUT"
          fi

  build-amd64:
    needs: set-tag
    runs-on: arc-runner-llm-agents
    steps:
      - uses: actions/checkout@v6
      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: Build and push piper (amd64)
        run: |
          docker build -t "${IMAGE}:piper-${{ needs.set-tag.outputs.tag }}-amd64" ./piper
          docker push "${IMAGE}:piper-${{ needs.set-tag.outputs.tag }}-amd64"

  build-arm64:
    needs: set-tag
    runs-on: [self-hosted, mac-mini]
    steps:
      - uses: actions/checkout@v6
      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: Build and push piper (arm64)
        run: |
          docker build -t "${IMAGE}:piper-${{ needs.set-tag.outputs.tag }}-arm64" ./piper
          docker push "${IMAGE}:piper-${{ needs.set-tag.outputs.tag }}-arm64"

  manifest:
    needs: [set-tag, build-amd64, build-arm64]
    runs-on: arc-runner-llm-agents
    steps:
      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:piper-${TAG}" \
            "${IMAGE}:piper-${TAG}-amd64" \
            "${IMAGE}:piper-${TAG}-arm64"

          docker buildx imagetools create -t "${IMAGE}:piper-latest" \
            "${IMAGE}:piper-${TAG}-amd64" \
            "${IMAGE}:piper-${TAG}-arm64"

  deploy:
    needs: [set-tag, manifest]
    runs-on: arc-runner-llm-agents
    steps:
      - uses: actions/checkout@v6
      - name: Raise PR to gitops
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
          PREFIX: ${{ needs.set-tag.outputs.pr_prefix }}
        run: |
          rm -rf /tmp/gitops
          git clone https://x-access-token:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git /tmp/gitops
          cd /tmp/gitops

          BRANCH="${PREFIX}/llm-agents-piper-${TAG}"
          git checkout -b "${BRANCH}"

          sed -i "s|amerenda/llm-agents:piper-[^ ]*|amerenda/llm-agents:piper-${TAG}|g" \
            apps/llm-agents/piper/deployment.yaml

          git config user.name "amerenda-deploy-bot[bot]"
          git config user.email "3192609+amerenda-deploy-bot[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "${PREFIX}: llm-agents piper ${TAG}"
          git push origin "${BRANCH}"

          COMMIT_MSG=$(git -C "${GITHUB_WORKSPACE}" log -1 --format='%s' 2>/dev/null || echo "")
          NL=$'\n'
          PR_BODY="**llm-agents piper ${TAG}**${NL}${NL}${COMMIT_MSG}${NL}${NL}Image: \`amerenda/llm-agents:piper-${TAG}\` (multi-arch: amd64+arm64)${NL}Source: https://github.com/amerenda/llm-agents/commit/${GITHUB_SHA}"

          curl -s -X POST \
            -H "Authorization: token ${GITOPS_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITOPS_REPO}/pulls" \
            -d "$(jq -n \
              --arg title "${PREFIX}: llm-agents piper ${TAG}" \
              --arg body "${PR_BODY}" \
              --arg head "${BRANCH}" \
              --arg base "main" \
              '{title: $title, body: $body, head: $head, base: $base}')"


  notify-failure:
    if: failure()
    needs: [detect-changes, test-piper, build-amd64, build-arm64, manifest, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Issue for build failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "CI failed: ${{ github.workflow }}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "ci-failure" || echo "Could not create issue"
